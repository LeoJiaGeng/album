# GitHub Pages 配置文件
# 用于配置网站的基本信息

# 网站标题
title: 霊雨霏霏工作室 - 艺术相册

# 网站描述
description: 霊雨霏霏工作室艺术相册，展示国画、油画、水彩、版画、书法等艺术作品

# 作者
